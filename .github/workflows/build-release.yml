name: Build & Release Yue2 Studio Standalone App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 build
          - os: windows-latest
            artifact_name: Yue2Studio-Windows-x64
            archive_ext: zip
            binary_name: audiocpp_cli.exe
          # Linux x64 build
          - os: ubuntu-22.04
            artifact_name: Yue2Studio-Linux-x64
            archive_ext: tar.gz
            binary_name: audiocpp_cli
          # macOS Apple Silicon (Metal) build
          - os: macos-14
            artifact_name: Yue2Studio-macOS-arm64
            archive_ext: zip
            binary_name: audiocpp_cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------- BUILD AUDIO.CPP ENGINE -----------------
      - name: Build audio.cpp on Windows (CPU)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/0xShug0/audio.cpp.git audio-cpp
          cd audio-cpp
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1 -Preset windows-cpu-release -ModelSet custom -Models "yue2" -Target audiocpp_cli
          New-Item -ItemType Directory -Force -Path ..\bin | Out-Null
          $cli = Get-ChildItem -Recurse -Filter audiocpp_cli.exe | Select-Object -First 1
          if (-not $cli) { throw "audiocpp_cli.exe not found after build" }
          Copy-Item $cli.FullName ..\bin\audiocpp_cli.exe
          Get-ChildItem ..\bin

      - name: Build audio.cpp on Linux (CPU)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-13 g++-13 cmake ninja-build libsndfile1-dev
          git clone --depth 1 https://github.com/0xShug0/audio.cpp.git audio-cpp
          cd audio-cpp
          export CC=gcc-13 CXX=g++-13
          ./scripts/build_linux.sh --backend cpu --model-set custom --models yue2 --target audiocpp_cli
          mkdir -p ../bin
          CLI_BIN=$(find build -type f -name audiocpp_cli | head -n 1)
          if [ -z "$CLI_BIN" ]; then echo "audiocpp_cli not found after build"; exit 1; fi
          cp "$CLI_BIN" ../bin/
          ls -la ../bin

      - name: Build audio.cpp on macOS (Metal backend)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/0xShug0/audio.cpp.git audio-cpp
          cd audio-cpp
          ./scripts/build_metal.sh --model-set custom --models yue2 --target audiocpp_cli
          mkdir -p ../bin
          CLI_BIN=$(find build -type f -name audiocpp_cli | head -n 1)
          if [ -z "$CLI_BIN" ]; then echo "audiocpp_cli not found after build"; exit 1; fi
          cp "$CLI_BIN" ../bin/
          ls -la ../bin

      # ----------------- BUNDLE WITH PYINSTALLER -----------------
      - name: Package standalone app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Yue2Studio" `
            --add-binary "bin/audiocpp_cli.exe;bin" `
            --collect-all customtkinter `
            app/main.py
          Compress-Archive -Path dist/Yue2Studio -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package standalone app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          pyinstaller --noconfirm --onedir --windowed --name "Yue2Studio" \
            --add-binary "bin/audiocpp_cli:bin" \
            --collect-all customtkinter \
            app/main.py
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist Yue2Studio

      - name: Package standalone app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          pyinstaller --noconfirm --onedir --windowed --name "Yue2Studio" \
            --add-binary "bin/audiocpp_cli:bin" \
            --collect-all customtkinter \
            app/main.py
          cd dist
          zip -r ../${{ matrix.artifact_name }}.zip Yue2Studio.app

      # ----------------- UPLOAD ARTIFACTS -----------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
          generate_release_notes: true
