name: Build & Release Yue2 Studio Standalone App

# One artifact per OS, each with every backend compiled in:
#   Windows: CPU + CUDA + Vulkan | Linux: CPU + CUDA + Vulkan | macOS: CPU + Metal
# The in-app backend dropdown (auto/cuda/cpu/vulkan/metal) selects at RUNTIME.
# Upstream audio.cpp CMake allows CUDA+Vulkan together (only CUDA+HIP is
# forbidden); its helper scripts just package them separately. Here we
# configure CMake directly to get a single all-backend binary. Models are
# never bundled — they download on first run (~2.6GB q4_0 / ~4.2GB q8_0).
#
# NVIDIA-driver-only symbols: nvcuda.dll / nvml.dll / nvapi64.dll (Win) and
# libcuda.so.1 / libnvidia-ml.so.1 (Linux) ship ONLY with the display driver.
# The CUDA driver API (cuDeviceGet, cuMemAddressReserve, ...) resolves only
# against them. Layers guarding this:
#   1. GGML_CUDA_NO_VMM=ON — disables ggml's own driver-API (VMM) path.
#   2. Pre-flight (all OS jobs): refuse any audio.cpp state whose OWN code
#      calls cuXxx directly outside ggml/external. Windows could delay-load
#      such an import, but ELF cannot — a linked libcuda.so.1 is a hard
#      DT_NEEDED that refuses to start on driverless machines. The pre-flight
#      walks --first-parent back to the last ancestor without such calls
#      (git grep only, no compiling) and prints the effective SHA.
#   3. /DELAYLOAD:nvcuda.dll delayimp.lib (Windows) — any future upstream
#      import degrades to a first-call load instead of a startup failure.
#   4. The import-closure (dumpbin) / ldd guards still hard-fail by name if a
#      driver DLL/DSO ever lands in the static import table.
#   5. CUDA runtime (cudart/cublas/cublasLt/cufft/nvJitLink) IS redistributable
#      and IS bundled next to the CLI in both CUDA jobs.
#
# Smoke tests: --list-devices on a GPU-less CI runner may exit non-zero at the
# application level (nothing to enumerate). That is tolerated. What is NOT
# tolerated: the binary failing to start — NTSTATUS codes on Windows
# (negative $LASTEXITCODE, e.g. 0xC0000135 missing DLL) and loader errors /
# signal deaths on Linux (exit 127 / >=128).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      windows:
        description: 'Build Windows (CPU+CUDA+Vulkan)'
        type: boolean
        default: true
      linux:
        description: 'Build Linux (CPU+CUDA+Vulkan)'
        type: boolean
        default: true
      mac:
        description: 'Build macOS Metal (arm64)'
        type: boolean
        default: true
      cpu_arch:
        description: 'Windows CPU architecture profile'
        type: choice
        options: [avx2, baseline]
        default: avx2
      cuda_arch:
        description: 'CUDA GPU coverage (wider = slower build)'
        type: choice
        options: ['rtx3040', 'rtx203040', 'gtx10plus', 'legacy', 'wide', 'full']
        default: 'rtx3040'
      audiocpp_ref:
        description: 'audio.cpp ref override (branch/tag/SHA/SHA~N) — pre-flight walks back to the last driver-API-free ancestor; overrides env.AUDIOCPP_REF'
        type: string
        default: ''
      appimage:
        description: 'Build Linux AppImage'
        type: boolean
        default: true
      rpm:
        description: 'Build Linux RPM'
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.11'
  CUDA_VERSION_WINDOWS: '12.8.1'
  CUDA_VERSION_LINUX: '12.8.1'
  VULKAN_VERSION: '1.4.357.0'
  CUDA_ARCHES: '86;89'
  # Pinned audio.cpp source: branch, tag, commit SHA, or '<SHA>~<N>'. The
  # 2026-09-21 window around 779714db0872cc7351d69baeaafb8bd5cf47fac7 added
  # direct CUDA-driver-API calls (cuDeviceGet/cuDeviceGetAttribute) in
  # attention_fallback.cpp; its CMake linkage and the calls landed in separate
  # commits, so '~1' links-broken (undefined cuDeviceGet) while the commit
  # itself links with a static nvcuda.dll import — neither is shippable. The
  # build steps' pre-flight walks --first-parent back to the nearest ancestor
  # with NO direct driver-API calls outside ggml and prints
  # 'audio.cpp HEAD (effective)'. After a green run, replace this with that
  # literal SHA. Test candidates via the audiocpp_ref dispatch input.
  AUDIOCPP_REF: '779714db0872cc7351d69baeaafb8bd5cf47fac7~1'

jobs:
  # ================= Windows: CPU + CUDA + Vulkan =================
  windows:
    name: Windows x64 (CPU+CUDA+Vulkan)
    # Pinned: windows-latest now ships VS18 (MSVC 19.51, VS 2026) which CUDA 12.8's
    # nvcc rejects in host_config.h (fatal C1189, only VS 2017-2022 allowed).
    runs-on: windows-2022
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: 'x64'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: ${{ env.CUDA_VERSION_WINDOWS }}
          method: 'local'
          use-github-cache: 'true'
          use-local-cache: 'true'

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Build audio.cpp (CPU+CUDA+Vulkan, distributable)
        shell: pwsh
        run: |
          # Direct CMake: helper scripts force a single GPU backend; upstream
          # CMake itself only forbids CUDA+HIP, so CUDA+Vulkan configure fine.
          $arch = "${{ inputs.cpu_arch }}"
          if ([string]::IsNullOrEmpty($arch)) { $arch = "avx2" }
          if ($arch -eq "baseline") {
            $isa = @("-DGGML_AVX=OFF", "-DGGML_AVX2=OFF", "-DGGML_AVX512=OFF", "-DGGML_AVX512_VBMI=OFF", "-DGGML_AVX512_VNNI=OFF", "-DGGML_AVX512_BF16=OFF", "-DGGML_AV_VNNI=OFF")
            $llamafile = "OFF"
          } else {
            $isa = @("-DGGML_AVX=ON", "-DGGML_AVX2=ON", "-DGGML_AVX512=OFF", "-DGGML_AVX512_VBMI=OFF", "-DGGML_AVX512_VNNI=OFF", "-DGGML_AVX512_BF16=OFF", "-DGGML_AV_VNNI=ON")
            $llamafile = "ON"
          }
          # depth 30: history headroom for the pre-flight walk-back below.
          git clone --depth 30 https://github.com/0xShug0/audio.cpp.git audio-cpp
          # Pin: dispatch input wins over env.AUDIOCPP_REF; 'HEAD' floats.
          # Supported refs: branch/tag, plain SHA, or '<SHA>~<N>'. '~' cannot
          # be resolved server-side, so fetch enough history and resolve
          # locally.
          $audioRef = "${{ inputs.audiocpp_ref }}"
          if ([string]::IsNullOrEmpty($audioRef)) { $audioRef = "$env:AUDIOCPP_REF" }
          if ($audioRef -and $audioRef -ne "HEAD") {
            if ($audioRef -match '^([0-9a-fA-F]{6,40})~(\d+)$') {
              $baseSha = $Matches[1]; $back = [int]$Matches[2]
              if ($back -gt 28) { throw "audio.cpp pin '~$back' exceeds the 30-commit fetch depth" }
              git -C audio-cpp fetch --depth 30 origin "$baseSha"
              $pinSha = "$(git -C audio-cpp rev-parse "$baseSha~$back")"
              if ([string]::IsNullOrEmpty($pinSha)) { throw "could not resolve audio.cpp pin '$audioRef' (is $baseSha reachable upstream?)" }
              git -C audio-cpp checkout $pinSha
              if ($LASTEXITCODE -ne 0) { throw "git checkout of audio.cpp pin '$pinSha' failed" }
            } else {
              git -C audio-cpp fetch --depth 30 origin "$audioRef"
              git -C audio-cpp checkout FETCH_HEAD
            }
          }
          $audioHead = "$(git -C audio-cpp rev-parse HEAD)"
          "audio.cpp ref: $audioRef"
          "audio.cpp HEAD: $audioHead"
          # ---- Pre-flight: never build a state that calls the CUDA driver API ----
          # attention_fallback.cpp (engine_runtime) calls cuDeviceGet /
          # cuDeviceGetAttribute. Those symbols come ONLY from the driver
          # import lib (nvcuda.lib / libcuda.so stub): Windows could delay-load
          # it, but on Linux a linked driver lib is a DT_NEEDED that refuses to
          # start on driverless machines. The only shippable state is one with
          # no direct cuXxx calls outside ggml (ggml's VMM path is off via
          # GGML_CUDA_NO_VMM=ON). Upstream's calls and their CMake linkage
          # landed in separate commits, so pins can land on unbuildable
          # intermediates — walk --first-parent back to the last ancestor
          # without them. git grep only; ~seconds. The regex requires '('
          # right after the symbol, so dlsym-style strings ("cuDeviceGet")
          # and cublas*/cudart* names (lowercase after 'cu') do NOT match.
          $apiRe = '(^|[^A-Za-z0-9_])cu[A-Z][A-Za-z0-9_]*[[:space:]]*\('
          $gspec = @('--', '*.cpp', '*.cc', '*.c', '*.h', '*.hpp', '*.cu', '*.cuh',
                     ':(exclude)ggml', ':(exclude)external', ':(exclude)third_party',
                     ':(exclude)examples', ':(exclude)tests')
          $cleanSha = $null
          foreach ($sha in @(git -C audio-cpp rev-list --first-parent -n 30 HEAD)) {
            $hits = @(git -C audio-cpp grep -E "$apiRe" "$sha" @gspec 2>$null)
            if ($hits.Count -eq 0) { $cleanSha = $sha; break }
            "  pre-flight: $sha calls the CUDA driver API directly (e.g. $($hits[0])) — not shippable; stepping back"
          }
          if (-not $cleanSha) {
            throw "no audio.cpp ancestor within 30 commits of $audioHead is free of direct CUDA driver-API calls — pin a known-green AUDIOCPP_REF (see 'audio.cpp HEAD:' in the last green run)"
          }
          if ($cleanSha -ne "$(git -C audio-cpp rev-parse HEAD)") {
            git -C audio-cpp checkout $cleanSha
            if ($LASTEXITCODE -ne 0) { throw "git checkout of pre-flight ancestor $cleanSha failed" }
            "::warning::audio.cpp $audioHead calls the CUDA driver API directly (upstream link-break / driver-only import); building last clean ancestor $cleanSha instead. Set AUDIOCPP_REF to that SHA for reproducible releases."
          }
          $audioHead = "$(git -C audio-cpp rev-parse HEAD)"
          "audio.cpp HEAD (effective): $audioHead"
          # NOTE: do not put '#' comment lines inside the backtick-continued
          # cmake call below. Keep this cmake invocation comment-free.
          $env:NVCC_PREPEND_OPTIONS = "-allow-unsupported-compiler"
          $env:NVCC_PREPEND_FLAGS = "-allow-unsupported-compiler"
          $cudaPreset = "${{ inputs.cuda_arch }}"
          if ([string]::IsNullOrEmpty($cudaPreset)) { $cudaPreset = $env:CUDA_ARCHES }
          $cudaArches = switch ($cudaPreset) {
            "rtx3040"   { "86;89" }
            "rtx203040" { "75;86;89" }
            "gtx10plus" { "61;75;86;89" }
            "legacy"    { "52;61;75;86;89" }
            "wide"      { "75-real;80-virtual;86-real;89-real;90-virtual;120a-real" }
            "full"      { "full" }
            default     { $cudaPreset }
          }
          $cudaArchFlag = @()
          if (-not [string]::IsNullOrEmpty($cudaArches) -and $cudaArches -ne "full") { $cudaArchFlag = @("-DCMAKE_CUDA_ARCHITECTURES=$cudaArches") }
          cmake -S audio-cpp -B build/windows-all-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_FLAGS=/utf-8 "-DCMAKE_CXX_FLAGS=/utf-8 /EHsc" `
            -DOpenMP_C_FLAGS=/openmp:experimental -DOpenMP_CXX_FLAGS=/openmp:experimental `
            -DENGINE_ENABLE_CUDA=ON -DENGINE_ENABLE_CUDA_GRAPHS=ON `
            -DENGINE_ENABLE_VULKAN=ON -DENGINE_ENABLE_METAL=OFF `
            -DENGINE_ENABLE_OPENMP=ON -DGGML_OPENMP=ON `
            -DENGINE_ENABLE_NATIVE_CPU=OFF -DENGINE_ENABLE_LLAMAFILE=$llamafile `
            @isa `
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON `
            -DAUDIOCPP_MODEL_SET=custom -DAUDIOCPP_MODELS=yue2 `
            @cudaArchFlag `
            -DGGML_CUDA_NO_VMM=ON `
            "-DCMAKE_EXE_LINKER_FLAGS=/machine:x64 /DELAYLOAD:nvcuda.dll delayimp.lib" `
            "-DCMAKE_SHARED_LINKER_FLAGS=/machine:x64 /DELAYLOAD:nvcuda.dll delayimp.lib" `
            -DCUDAToolkit_ROOT="$env:CUDA_PATH" `
            "-DCMAKE_CUDA_FLAGS=-Xcompiler=/utf-8 -allow-unsupported-compiler"
          if (-not (Select-String -Path build/windows-all-release/CMakeCache.txt -Pattern "^GGML_OPENMP_ENABLED:INTERNAL=ON$" -Quiet)) {
            throw "OpenMP was requested but ggml did not configure GGML_OPENMP_ENABLED=ON."
          }
          $jobs = [Math]::Max(2, [Environment]::ProcessorCount)
          cmake --build build/windows-all-release -j $jobs --target audiocpp_cli
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $cli = Get-ChildItem -Recurse -Path build/windows-all-release -Filter audiocpp_cli.exe | Select-Object -First 1
          if (-not $cli) { throw "audiocpp_cli.exe not found after build" }
          Copy-Item $cli.FullName bin\audiocpp_cli.exe
          Get-ChildItem -Path (Split-Path $cli.FullName -Parent) -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName bin\ -Force }
          # CUDA runtime DLLs (always dynamic) from the toolkit. nvjitlink is
          # required by cuBLAS/cuFFT in CUDA 12.x.
          foreach ($d in @("$env:CUDA_PATH\bin", "$env:CUDA_PATH\bin\x64", "$env:CUDA_PATH\lib")) {
            if (Test-Path $d) {
              foreach ($pat in @("cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll", "cufft64_*.dll", "nvjitlink*.dll")) {
                Copy-Item "$d\$pat" bin\ -Force -ErrorAction SilentlyContinue
              }
            }
          }
          # MSVC + OpenMP runtime DLLs (vswhere discovery, any VS2022 edition).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vs) {
              $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
              if ($redist) {
                foreach ($sub in 'x64\Microsoft.VC143.CRT', 'x64\Microsoft.VC143.OpenMP') {
                  $dir = Join-Path $redist.FullName $sub
                  if (Test-Path $dir) {
                    Get-ChildItem "$dir\*.dll" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(vcruntime140|msvcp140|vcomp140)' } | Copy-Item -Destination bin\ -Force -ErrorAction SilentlyContinue
                  }
                }
              }
            }
          }
          # ---- Resolve the exe's full static-import closure and bundle it ----
          # (delay-loaded driver DLLs are fine and only noted; STATIC ones
          # hard-fail by name — see file header. With the pre-flight above and
          # /DELAYLOAD in place, nvcuda should never appear statically.)
          $binDir = "$PWD\bin"
          if (Get-Command dumpbin -ErrorAction SilentlyContinue) {
            $searchDirs = @($binDir, "$env:SystemRoot\System32", "$env:SystemRoot")
            $searchDirs += @($env:PATH -split ';' | Where-Object { $_ })
            $searchDirs += @(Get-ChildItem -Recurse -Path build/windows-all-release -Filter *.dll -ErrorAction SilentlyContinue | Select-Object -ExpandProperty DirectoryName -Unique)
            $searchDirs += @(Get-ChildItem -Recurse -Path "C:\VulkanSDK\${env:VULKAN_VERSION}" -Filter *.dll -ErrorAction SilentlyContinue | Select-Object -ExpandProperty DirectoryName -Unique)
            $driverDlls = @("nvcuda.dll", "nvml.dll", "nvapi64.dll")
            $seen = @{}
            $missing = @()
            $driverMissing = @()
            $queue = @("$binDir\audiocpp_cli.exe")
            for ($round = 0; $round -lt 6 -and $queue.Count -gt 0; $round++) {
              $next = @()
              foreach ($f in $queue) {
                $mode = 0
                foreach ($line in (& dumpbin /dependents $f 2>$null)) {
                  if ($line -match 'delay load dependencies') { $mode = 1; continue }
                  if ($line -match 'has the following dependencies') { $mode = 2; continue }
                  if ($mode -eq 0 -or $line -notmatch '^\s+([A-Za-z0-9_\-.]+\.dll)\s*$') { continue }
                  $dep = $Matches[1]
                  $key = $dep.ToLowerInvariant()
                  if ($seen.ContainsKey($key)) { continue }
                  $seen[$key] = $true
                  if ($dep -match '^(api|ext)-ms-win-') { continue }
                  if ($driverDlls -contains $key) {
                    if ($mode -eq 2) {
                      "  DRIVER-DLL  $dep  statically imported by $(Split-Path $f -Leaf) — NVIDIA-driver-only, never bundleable"
                      $driverMissing += $dep
                    } else {
                      "  delay-loaded driver DLL (acceptable): $dep"
                    }
                    continue
                  }
                  $hit = $null
                  foreach ($d in $searchDirs) {
                    if (-not $d) { continue }
                    $p = Join-Path $d $dep
                    if (Test-Path -LiteralPath $p -ErrorAction SilentlyContinue) { $hit = $p; break }
                  }
                  if (-not $hit) {
                    if ($mode -eq 1) { "  delay-load not present on this machine (not fatal): $dep" }
                    else { "  MISSING  $dep  (imported by $(Split-Path $f -Leaf))"; $missing += $dep }
                    continue
                  }
                  if ($hit -like "$env:SystemRoot\*") { continue }
                  if (-not $hit.StartsWith("$binDir\", [StringComparison]::OrdinalIgnoreCase)) {
                    Copy-Item -LiteralPath $hit -Destination $binDir -Force
                    "  bundled  $dep  <- $hit"
                  }
                  $next += (Join-Path $binDir $dep)
                }
              }
              $queue = $next
            }
            "audiocpp_cli import closure: $(($seen.Keys | Sort-Object) -join ', ')"
            if ($driverMissing.Count -gt 0) {
              throw ("audio.cpp HEAD $audioHead statically imports NVIDIA driver DLL(s): $($driverMissing -join ', '). " +
                     "These ship ONLY with the NVIDIA display driver — the exe would refuse to start on every machine " +
                     "without an NVIDIA GPU. Upstream must load the driver API dynamically (LoadLibrary/delay-load), " +
                     "or pin AUDIOCPP_REF to the last commit before this change.")
            }
            if ($missing.Count -gt 0) {
              throw ("Unresolvable DLL import(s): $($missing -join ', ') — not in bin\, the build tree, System32 or PATH. " +
                     "If this is a third-party DLL, audio.cpp must vendor it or load it dynamically, or pin AUDIOCPP_REF.")
            }
          } else {
            "dumpbin not on PATH; skipping import-closure resolution (smoke test still runs)"
          }
          # Bundle the redistributable Vulkan loader (ggml-vulkan imports it).
          if (-not (Test-Path -LiteralPath "$binDir\vulkan-1.dll")) {
            if (Test-Path -LiteralPath "$env:SystemRoot\System32\vulkan-1.dll") {
              Copy-Item -LiteralPath "$env:SystemRoot\System32\vulkan-1.dll" -Destination $binDir -Force
              "  bundled  vulkan-1.dll <- System32"
            }
          }
          # App-local VC runtime + OpenMP fallback from System32.
          foreach ($rt in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_atomic_wait.dll", "vcomp140.dll")) {
            $src = "$env:SystemRoot\System32\$rt"
            if ((Test-Path -LiteralPath $src) -and -not (Test-Path -LiteralPath "$binDir\$rt")) {
              Copy-Item -LiteralPath $src -Destination $binDir -Force
            }
          }
          # Hard-fail if CUDA silently did not make it into the build.
          $cudaLinked = $false
          if (Get-ChildItem -Recurse -Path build/windows-all-release -Filter "*cuda*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1) { $cudaLinked = $true }
          if (Select-String -Path build/windows-all-release/CMakeCache.txt -Pattern "^GGML_CUDA:BOOL=ON$" -Quiet) { $cudaLinked = $true }
          if (-not $cudaLinked -and (Get-Command dumpbin -ErrorAction SilentlyContinue)) {
            if (& dumpbin /dependents bin\audiocpp_cli.exe | Select-String -Pattern "cudart64|cublas64|cufft64|nvjitlink" -Quiet) { $cudaLinked = $true }
          }
          if (-not $cudaLinked) { throw "CUDA backend was not linked into the build" }
          Get-ChildItem bin
          # Smoke test (informational: no GPU on the runner). Negative
          # $LASTEXITCODE = NTSTATUS loader failure; plain non-zero = app-level
          # result, tolerated. Trailing 'exit 0' matters for step result.
          & .\bin\audiocpp_cli.exe --list-devices
          $smoke = $LASTEXITCODE
          "audiocpp_cli --list-devices exit code: $smoke"
          if ($smoke -lt 0) {
            throw ("audiocpp_cli.exe did not start cleanly (NTSTATUS 0x{0:X8}) — see the import-closure output above" -f ($smoke -band 0xFFFFFFFF))
          }
          if ($smoke -ne 0) {
            "non-zero app exit code tolerated on this GPU-less runner; showing --help instead:"
            & .\bin\audiocpp_cli.exe --help 2>&1 | ForEach-Object { "$_" } | Select-Object -First 40
            $help = $LASTEXITCODE
            "audiocpp_cli --help exit code: $help"
            if ($help -lt 0) {
              throw ("audiocpp_cli.exe --help also failed to start (NTSTATUS 0x{0:X8})" -f ($help -band 0xFFFFFFFF))
            }
          }
          exit 0

      - name: Verify 64-bit binary (Windows x64)
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("bin\audiocpp_cli.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          "PE Machine: 0x$($machine.ToString('X4'))"
          if ($machine -ne 0x8664) { throw "audiocpp_cli.exe is NOT 64-bit x86 (Machine=0x$($machine.ToString('X4')))" }
          python -c "import struct; assert struct.calcsize('P')*8 == 64, 'Python is not 64-bit'"
          "Windows x86_64 check passed."

      - name: Package standalone app (Windows)
        shell: pwsh
        run: |
          $addBin = @()
          $addBin += "--add-binary"; $addBin += "bin/audiocpp_cli.exe;bin"
          Get-ChildItem -Path bin -Filter *.dll | ForEach-Object { $addBin += "--add-binary"; $addBin += "bin/$($_.Name);bin" }
          pyinstaller --noconfirm --onedir --windowed --name "Yue2Studio" @addBin --collect-all customtkinter app/main.py
          7z a -tzip -mx=3 Yue2Studio-Windows-x64.zip ./dist/Yue2Studio/*

      - name: Upload build artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Yue2Studio-Windows-x64
          path: Yue2Studio-Windows-x64.zip

  # ================= Linux: CPU + CUDA + Vulkan =================
  linux:
    name: Linux x64 (CPU+CUDA+Vulkan)
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: 'x64'
          cache: 'pip'

      - name: Install Python dependencies
        shell: bash
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install build dependencies (CPU/Vulkan side)
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          if ! command -v gcc-13 >/dev/null 2>&1; then
            sudo apt-get install -y -qq gcc-13 g++-13
          fi
          sudo apt-get install -y -qq cmake ninja-build libsndfile1-dev rpm file ccache glslc libvulkan-dev spirv-headers patchelf

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: ${{ env.CUDA_VERSION_LINUX }}
          method: 'network'
          use-github-cache: 'true'
          use-local-cache: 'true'

      - name: Cache ccache (C/C++/CUDA rebuilds)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-cuda${{ env.CUDA_VERSION_LINUX }}-gcc13-${{ hashFiles('.github/workflows/build-release.yml') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-cuda${{ env.CUDA_VERSION_LINUX }}-gcc13-${{ hashFiles('.github/workflows/build-release.yml') }}-
            ccache-linux-cuda${{ env.CUDA_VERSION_LINUX }}-gcc13-

      - name: Build audio.cpp (CPU+CUDA+Vulkan, portable)
        shell: bash
        run: |
          set -euxo pipefail
          CUDA_PRESET="${{ inputs.cuda_arch }}"
          if [ -z "$CUDA_PRESET" ]; then CUDA_PRESET="$CUDA_ARCHES"; fi
          case "$CUDA_PRESET" in
            "rtx3040") CUDA_ARCHES="86;89" ;;
            "rtx203040") CUDA_ARCHES="75;86;89" ;;
            "gtx10plus") CUDA_ARCHES="61;75;86;89" ;;
            "legacy") CUDA_ARCHES="52;61;75;86;89" ;;
            "wide") CUDA_ARCHES="75-real;80-virtual;86-real;89-real;90-virtual;120a-real" ;;
            "full") CUDA_ARCHES="full" ;;
            *) CUDA_ARCHES="$CUDA_PRESET" ;;
          esac
          CUDA_ARCH_ARGS=()
          if [ -n "$CUDA_ARCHES" ] && [ "$CUDA_ARCHES" != "full" ]; then CUDA_ARCH_ARGS=("-DCMAKE_CUDA_ARCHITECTURES=$CUDA_ARCHES"); fi
          # depth 30: history headroom for the pre-flight walk-back below.
          git clone --depth 30 https://github.com/0xShug0/audio.cpp.git audio-cpp
          # Pin: dispatch input wins over env.AUDIOCPP_REF; 'HEAD' floats.
          AUDIO_REF="${{ inputs.audiocpp_ref }}"
          if [ -z "$AUDIO_REF" ]; then AUDIO_REF="${AUDIOCPP_REF:-HEAD}"; fi
          if [ -n "$AUDIO_REF" ] && [ "$AUDIO_REF" != "HEAD" ]; then
            if [[ "$AUDIO_REF" =~ ^([0-9a-fA-F]{6,40})~([0-9]+)$ ]]; then
              BASE_SHA="${BASH_REMATCH[1]}"; BACK="${BASH_REMATCH[2]}"
              if [ "$BACK" -gt 28 ]; then echo "::error::pin '~${BACK}' exceeds the 30-commit fetch depth"; exit 1; fi
              git -C audio-cpp fetch --depth 30 origin "$BASE_SHA"
              PIN_SHA="$(git -C audio-cpp rev-parse "${BASE_SHA}~${BACK}")"
              git -C audio-cpp checkout "$PIN_SHA"
            else
              git -C audio-cpp fetch --depth 30 origin "${AUDIO_REF}"
              git -C audio-cpp checkout FETCH_HEAD
            fi
          fi
          AUDIO_HEAD="$(git -C audio-cpp rev-parse HEAD)"
          echo "audio.cpp ref: ${AUDIO_REF}"
          echo "audio.cpp HEAD: ${AUDIO_HEAD}"
          # ---- Pre-flight: never build a state that calls the CUDA driver API ----
          # (rationale in the Windows job: cuDeviceGet & co. resolve only
          # against the NVIDIA driver import lib; ELF has no delay-load, so a
          # linked libcuda.so.1 is a startup-failing DT_NEEDED on driverless
          # machines. Walk --first-parent to the last ancestor whose own code
          # has no direct cuXxx calls outside ggml. git grep only, ~seconds.)
          API_RE='(^|[^A-Za-z0-9_])cu[A-Z][A-Za-z0-9_]*[[:space:]]*\('
          GSPEC=(-- '*.cpp' '*.cc' '*.c' '*.h' '*.hpp' '*.cu' '*.cuh'
                 ':(exclude)ggml' ':(exclude)external' ':(exclude)third_party'
                 ':(exclude)examples' ':(exclude)tests')
          CLEAN_SHA=""
          for sha in $(git -C audio-cpp rev-list --first-parent -n 30 HEAD); do
            HITS="$(git -C audio-cpp grep -E "$API_RE" "$sha" "${GSPEC[@]}" 2>/dev/null || true)"
            if [ -z "$HITS" ]; then CLEAN_SHA="$sha"; break; fi
            echo "  pre-flight: $sha calls the CUDA driver API directly — not shippable; stepping back"
          done
          if [ -z "$CLEAN_SHA" ]; then
            echo "::error::no audio.cpp ancestor within 30 commits of ${AUDIO_HEAD} is free of direct CUDA driver-API calls — pin a known-green AUDIOCPP_REF"
            exit 1
          fi
          if [ "$CLEAN_SHA" != "$(git -C audio-cpp rev-parse HEAD)" ]; then
            git -C audio-cpp checkout "$CLEAN_SHA"
            echo "::warning::audio.cpp ${AUDIO_HEAD} calls the CUDA driver API directly (upstream link-break / driver-only import); building last clean ancestor ${CLEAN_SHA} instead. Set AUDIOCPP_REF to that SHA for reproducible releases."
          fi
          AUDIO_HEAD="$(git -C audio-cpp rev-parse HEAD)"
          echo "audio.cpp HEAD (effective): ${AUDIO_HEAD}"
          export CC=gcc-13 CXX=g++-13 CUDAHOSTCXX=g++-13
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="2G"
          export CCACHE_SLOPPINESS="time_macros,include_file_mtime,include_file_ctime,pch_defines,file_macro"
          ccache -z || true
          cmake -S audio-cpp -B build/linux-all-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DENGINE_ENABLE_CUDA=ON -DENGINE_ENABLE_CUDA_GRAPHS=ON \
            -DENGINE_ENABLE_VULKAN=ON \
            -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_LLAMAFILE=ON \
            -DGGML_CUDA_NO_VMM=ON \
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON \
            -DAUDIOCPP_MODEL_SET=custom -DAUDIOCPP_MODELS=yue2 \
            "${CUDA_ARCH_ARGS[@]}"
          cmake --build build/linux-all-release --parallel "$(nproc)" --target audiocpp_cli
          ccache -s || true
          mkdir -p bin
          CLI_BIN=$(find build/linux-all-release -type f -name audiocpp_cli | head -n 1)
          if [ -z "$CLI_BIN" ]; then echo "audiocpp_cli not found after build"; exit 1; fi
          cp "$CLI_BIN" bin/
          find "$(dirname "$CLI_BIN")" -maxdepth 1 -name "*.so*" -type f -exec cp {} bin/ \; || true
          ls -la bin
          # ---- Bundle the CUDA runtime (redistributable, unlike the driver) ----
          : "${CUDA_PATH:=/usr/local/cuda}"
          CUDA_LIB_DIRS=("${CUDA_PATH}/lib64" "${CUDA_PATH}/lib" "/usr/local/cuda/lib64")
          for lib in libcudart.so.12 libcublas.so.12 libcublasLt.so.12 libcufft.so.11 libnvJitLink.so.12; do
            found=""
            for d in "${CUDA_LIB_DIRS[@]}"; do
              if [ -e "$d/$lib" ]; then found="$d/$lib"; break; fi
            done
            if [ -n "$found" ]; then
              cp -L "$found" bin/
            else
              echo "WARNING: $lib not found in the CUDA toolkit — CUDA runtime incomplete"
            fi
          done
          patchelf --set-rpath '$ORIGIN' bin/audiocpp_cli
          for so in bin/*.so*; do
            if [ -f "$so" ]; then patchelf --set-rpath '$ORIGIN' "$so"; fi
          done
          # ---- ldd closure check; driver libs hard-fail by name ----
          DRIVER_LIBS="libcuda.so libcuda.so.1 libnvidia-ml.so.1"
          DRIVER_MISSING=""
          MISSING_LIBS=$(ldd bin/audiocpp_cli 2>/dev/null | grep 'not found' | awk '{print $1}' | sort -u || true)
          if [ -n "$MISSING_LIBS" ]; then
            for lib in $MISSING_LIBS; do
              case " $DRIVER_LIBS " in
                *" $lib "*) DRIVER_MISSING="$DRIVER_MISSING $lib"; continue ;;
              esac
              found=$(find build/linux-all-release "${CUDA_PATH:-/usr/local/cuda}" -name "$lib" -not -path "*/stubs/*" 2>/dev/null | head -n 1 || true)
              if [ -n "$found" ]; then
                cp -L "$found" "bin/$lib"
                patchelf --set-rpath '$ORIGIN' "bin/$lib" || true
                echo "bundled $lib <- $found"
              fi
            done
          fi
          if [ -n "$DRIVER_MISSING" ]; then
            echo "::error::audio.cpp statically links NVIDIA driver library(ies):${DRIVER_MISSING}"
            echo "These ship only with the NVIDIA driver — the binary cannot run on machines without one."
            echo "Fix upstream (dlopen the driver library) or pin AUDIOCPP_REF to the last green commit."
            exit 1
          fi
          STILL_MISSING=$(ldd bin/audiocpp_cli 2>/dev/null | grep 'not found' | awk '{print $1}' | sort -u || true)
          if [ -n "$STILL_MISSING" ]; then
            echo "::error::unresolved shared-library dependencies: ${STILL_MISSING}"
            echo "Not in the build tree or CUDA toolkit — audio.cpp must vendor it, or pin AUDIOCPP_REF."
            exit 1
          fi
          # Hard-fail if CUDA silently did not make it into the build.
          CUDA_LINKED=0
          if ldd bin/audiocpp_cli | grep -Eq 'libcublas|libcudart|libcufft'; then CUDA_LINKED=1; fi
          if find build/linux-all-release -type f -name '*cuda*.so*' | grep -q .; then CUDA_LINKED=1; fi
          if grep -q '^GGML_CUDA:BOOL=ON$' build/linux-all-release/CMakeCache.txt; then CUDA_LINKED=1; fi
          if [ "${CUDA_LINKED}" -ne 1 ]; then
            echo "ERROR: CUDA backend was not linked into the build"
            exit 1
          fi
          ls -la bin
          # Smoke test (informational: no GPU on the runner).
          rc=0
          ./bin/audiocpp_cli --list-devices || rc=$?
          echo "audiocpp_cli --list-devices exit code: $rc"
          if [ "$rc" -ge 126 ]; then
            echo "::error::audiocpp_cli did not run cleanly (exit $rc: 126/127 = loader error, >=128 = killed by signal)"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "non-zero app exit code tolerated on this GPU-less runner; showing --help instead:"
            ./bin/audiocpp_cli --help 2>&1 | head -n 40 || true
          fi

      - name: Verify 64-bit binary (Linux x86_64)
        shell: bash
        run: |
          set -euxo pipefail
          uname -m | grep -q "x86_64"
          file bin/audiocpp_cli | grep -q "x86-64"
          python3 -c "import struct; assert struct.calcsize('P')*8 == 64, 'Python is not 64-bit'"
          echo "Linux x86_64 check passed."

      - name: Package standalone app (Linux)
        shell: bash
        run: |
          set -euxo pipefail
          BIN_ARGS=(--add-binary "bin/audiocpp_cli:bin")
          for so in bin/*.so*; do
            if [ -f "$so" ]; then BIN_ARGS+=(--add-binary "$so:bin"); fi
          done
          pyinstaller --noconfirm --onedir --windowed --name "Yue2Studio" \
            "${BIN_ARGS[@]}" \
            --collect-all customtkinter \
            app/main.py
          tar -czf Yue2Studio-Linux-x64.tar.gz -C dist Yue2Studio

      - name: Build AppImage (Linux x86_64)
        if: github.event_name != 'workflow_dispatch' || inputs.appimage
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a dist/Yue2Studio/. AppDir/usr/bin/
          cp packaging/Yue2Studio.desktop AppDir/
          cp packaging/Yue2Studio.desktop AppDir/usr/share/applications/
          cp app/icon.png AppDir/Yue2Studio.png
          cp app/icon.png AppDir/.DirIcon
          cp app/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/Yue2Studio.png
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/Yue2Studio" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/Yue2Studio
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run AppDir Yue2Studio-Linux-x64.AppImage
          ls -la Yue2Studio-Linux-x64.AppImage

      - name: Build RPM (Linux x86_64)
        if: github.event_name != 'workflow_dispatch' || inputs.rpm
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then VERSION="0.0.0"; fi
          echo "RPM version: $VERSION"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          sed "s/@VERSION@/${VERSION}/" packaging/yue2studio.spec > ~/rpmbuild/SPECS/yue2studio.spec
          rpmbuild -bb --define "srcdir ${PWD}" ~/rpmbuild/SPECS/yue2studio.spec
          cp ~/rpmbuild/RPMS/x86_64/yue2studio-*.x86_64.rpm ./Yue2Studio-Linux-x64.rpm
          ls -la Yue2Studio-Linux-x64.rpm

      - name: Upload build artifacts (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: Yue2Studio-Linux-x64
          path: |
            Yue2Studio-Linux-x64.tar.gz
            Yue2Studio-Linux-x64.AppImage
            Yue2Studio-Linux-x64.rpm

  # ================= macOS Metal =================
  macos:
    name: macOS Metal (arm64)
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch' || inputs.mac
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        shell: bash
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build audio.cpp (Metal backend)
        shell: bash
        run: |
          set -euxo pipefail
          # Same pin + pre-flight as the other OS jobs so all three artifacts
          # ship the SAME audio.cpp source state.
          git clone --depth 30 https://github.com/0xShug0/audio.cpp.git audio-cpp
          AUDIO_REF="${{ inputs.audiocpp_ref }}"
          if [ -z "$AUDIO_REF" ]; then AUDIO_REF="${AUDIOCPP_REF:-HEAD}"; fi
          if [ -n "$AUDIO_REF" ] && [ "$AUDIO_REF" != "HEAD" ]; then
            if [[ "$AUDIO_REF" =~ ^([0-9a-fA-F]{6,40})~([0-9]+)$ ]]; then
              BASE_SHA="${BASH_REMATCH[1]}"; BACK="${BASH_REMATCH[2]}"
              if [ "$BACK" -gt 28 ]; then echo "::error::pin '~${BACK}' exceeds the 30-commit fetch depth"; exit 1; fi
              git -C audio-cpp fetch --depth 30 origin "$BASE_SHA"
              PIN_SHA="$(git -C audio-cpp rev-parse "${BASE_SHA}~${BACK}")"
              git -C audio-cpp checkout "$PIN_SHA"
            else
              git -C audio-cpp fetch --depth 30 origin "${AUDIO_REF}"
              git -C audio-cpp checkout FETCH_HEAD
            fi
          fi
          AUDIO_HEAD="$(git -C audio-cpp rev-parse HEAD)"
          echo "audio.cpp ref: ${AUDIO_REF}"
          echo "audio.cpp HEAD: ${AUDIO_HEAD}"
          # Pre-flight (same rule as Windows/Linux — keeps the three OS
          # artifacts on one upstream SHA even though Metal never links CUDA).
          API_RE='(^|[^A-Za-z0-9_])cu[A-Z][A-Za-z0-9_]*[[:space:]]*\('
          GSPEC=(-- '*.cpp' '*.cc' '*.c' '*.h' '*.hpp' '*.cu' '*.cuh'
                 ':(exclude)ggml' ':(exclude)external' ':(exclude)third_party'
                 ':(exclude)examples' ':(exclude)tests')
          CLEAN_SHA=""
          for sha in $(git -C audio-cpp rev-list --first-parent -n 30 HEAD); do
            HITS="$(git -C audio-cpp grep -E "$API_RE" "$sha" "${GSPEC[@]}" 2>/dev/null || true)"
            if [ -z "$HITS" ]; then CLEAN_SHA="$sha"; break; fi
            echo "  pre-flight: $sha calls the CUDA driver API directly — stepping back for cross-OS pin consistency"
          done
          if [ -z "$CLEAN_SHA" ]; then
            echo "::error::no audio.cpp ancestor within 30 commits of ${AUDIO_HEAD} is free of direct CUDA driver-API calls — pin a known-green AUDIOCPP_REF"
            exit 1
          fi
          if [ "$CLEAN_SHA" != "$(git -C audio-cpp rev-parse HEAD)" ]; then
            git -C audio-cpp checkout "$CLEAN_SHA"
            echo "::warning::audio.cpp ${AUDIO_HEAD} calls the CUDA driver API directly; building last clean ancestor ${CLEAN_SHA} for cross-OS pin consistency."
          fi
          echo "audio.cpp HEAD (effective): $(git -C audio-cpp rev-parse HEAD)"
          cd audio-cpp
          ./scripts/build_metal.sh --native-cpu OFF --model-set custom --models yue2 --target audiocpp_cli
          mkdir -p ../bin
          CLI_BIN=$(find build -type f -name audiocpp_cli | head -n 1)
          if [ -z "$CLI_BIN" ]; then echo "audiocpp_cli not found after build"; exit 1; fi
          cp "$CLI_BIN" ../bin/
          ls -la ../bin

      - name: Verify 64-bit binary (macOS arm64)
        shell: bash
        run: |
          set -euxo pipefail
          uname -m | grep -q "arm64"
          file bin/audiocpp_cli | grep -q "arm64"
          python3 -c "import struct; assert struct.calcsize('P')*8 == 64, 'Python is not 64-bit'"
          echo "macOS arm64 check passed."

      - name: Package standalone app (macOS)
        shell: bash
        run: |
          set -euxo pipefail
          pyinstaller --noconfirm --onedir --windowed --name "Yue2Studio" \
            --add-binary "bin/audiocpp_cli:bin" \
            --collect-all customtkinter \
            app/main.py
          cd dist
          zip -r ../Yue2Studio-macOS-arm64.zip Yue2Studio.app

      - name: Upload build artifacts (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: Yue2Studio-macOS-arm64
          path: Yue2Studio-macOS-arm64.zip

  release:
    name: Publish GitHub Release
    needs: [windows, linux, macos]
    # Not 'always()': a failed OS build must NOT publish a partial release.
    if: >-
      ${{ !cancelled()
          && needs.windows.result != 'failure'
          && needs.linux.result != 'failure'
          && needs.macos.result != 'failure'
          && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
          generate_release_notes: true
