name: Build & Release Yue2 Studio Standalone App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 build
          - os: windows-latest
            artifact_name: Yue2Studio-Windows-x64
            archive_ext: zip
            binary_name: audiocpp_cli.exe
          # Linux x64 build
          - os: ubuntu-22.04
            artifact_name: Yue2Studio-Linux-x64
            archive_ext: tar.gz
            binary_name: audiocpp_cli
          # macOS Apple Silicon (Metal) build
          - os: macos-14
            artifact_name: Yue2Studio-macOS-arm64
            archive_ext: zip
            binary_name: audiocpp_cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'  # force 64-bit interpreter so PyInstaller bundles x64
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------- BUILD AUDIO.CPP ENGINE -----------------
      - name: Build audio.cpp on Windows (CPU)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/0xShug0/audio.cpp.git audio-cpp
          cd audio-cpp
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1 -Preset windows-cpu-release -ModelSet custom -Models "yue2" -Target audiocpp_cli
          New-Item -ItemType Directory -Force -Path ..\bin | Out-Null
          $cli = Get-ChildItem -Recurse -Filter audiocpp_cli.exe | Select-Object -First 1
          if (-not $cli) { throw "audiocpp_cli.exe not found after build" }
          Copy-Item $cli.FullName ..\bin\audiocpp_cli.exe
          Get-ChildItem ..\bin

      - name: Build audio.cpp on Linux (CPU, x86_64)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          # audio.cpp requires GCC 13+, but vanilla Ubuntu 22.04 repos only go up
          # to GCC 12. Use the preinstalled compiler if present, else pull GCC 13
          # from the Ubuntu toolchain PPA (keeps the older 22.04 glibc for wider
          # compatibility of the resulting binaries).
          if ! command -v gcc-13 >/dev/null 2>&1; then
            sudo apt-get install -y -qq software-properties-common
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc-13 g++-13
          fi
          sudo apt-get install -y -qq cmake ninja-build libsndfile1-dev rpm file
          git clone --depth 1 https://github.com/0xShug0/audio.cpp.git audio-cpp
          cd audio-cpp
          export CC=gcc-13 CXX=g++-13
          ./scripts/build_linux.sh --backend cpu --model-set custom --models yue2 --target audiocpp_cli
          mkdir -p ../bin
          CLI_BIN=$(find build -type f -name audiocpp_cli | head -n 1)
          if [ -z "$CLI_BIN" ]; then echo "audiocpp_cli not found after build"; exit 1; fi
          cp "$CLI_BIN" ../bin/
          ls -la ../bin

      - name: Build audio.cpp on macOS (Metal backend)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/0xShug0/audio.cpp.git audio-cpp
          cd audio-cpp
          ./scripts/build_metal.sh --model-set custom --models yue2 --target audiocpp_cli
          mkdir -p ../bin
          CLI_BIN=$(find build -type f -name audiocpp_cli | head -n 1)
          if [ -z "$CLI_BIN" ]; then echo "audiocpp_cli not found after build"; exit 1; fi
          cp "$CLI_BIN" ../bin/
          ls -la ../bin

      # ----------------- VERIFY 64-BIT TARGET ARCH -----------------
      - name: Verify 64-bit binary (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Read the PE header Machine field: 0x8664 = AMD64 (x86_64)
          $bytes = [System.IO.File]::ReadAllBytes("bin\audiocpp_cli.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          "PE Machine: 0x$($machine.ToString('X4'))"
          if ($machine -ne 0x8664) { throw "audiocpp_cli.exe is NOT 64-bit x86 (Machine=0x$($machine.ToString('X4')))" }
          python -c "import struct; assert struct.calcsize('P')*8 == 64, 'Python is not 64-bit'"
          "Windows x86_64 check passed."

      - name: Verify 64-bit binary (Linux x86_64)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          uname -m | grep -q "x86_64"
          file bin/audiocpp_cli | grep -q "x86-64"
          python3 -c "import struct; assert struct.calcsize('P')*8 == 64, 'Python is not 64-bit'"
          echo "Linux x86_64 check passed."

      - name: Verify 64-bit binary (macOS arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          uname -m | grep -q "arm64"
          file bin/audiocpp_cli | grep -q "arm64"
          python3 -c "import struct; assert struct.calcsize('P')*8 == 64, 'Python is not 64-bit'"
          echo "macOS arm64 check passed."

      # ----------------- BUNDLE WITH PYINSTALLER -----------------
      - name: Package standalone app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Yue2Studio" `
            --add-binary "bin/audiocpp_cli.exe;bin" `
            --collect-all customtkinter `
            app/main.py
          Compress-Archive -Path dist/Yue2Studio -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package standalone app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          pyinstaller --noconfirm --onedir --windowed --name "Yue2Studio" \
            --add-binary "bin/audiocpp_cli:bin" \
            --collect-all customtkinter \
            app/main.py
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist Yue2Studio

      - name: Build AppImage (Linux x86_64)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          # Assemble AppDir from the PyInstaller onedir output (kept intact so
          # the bootloader finds its bundled libraries).
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a dist/Yue2Studio/. AppDir/usr/bin/
          cp packaging/Yue2Studio.desktop AppDir/
          cp packaging/Yue2Studio.desktop AppDir/usr/share/applications/
          cp app/icon.png AppDir/Yue2Studio.png
          cp app/icon.png AppDir/.DirIcon
          cp app/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/Yue2Studio.png
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/Yue2Studio" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/Yue2Studio
          # appimagetool itself is an AppImage; --appimage-extract-and-run avoids
          # needing FUSE on the runner.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run AppDir Yue2Studio-Linux-x64.AppImage
          ls -la Yue2Studio-Linux-x64.AppImage

      - name: Build RPM (Linux x86_64)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          # Version from tag (v1.2.3 -> 1.2.3); manual runs get 0.0.0.
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then VERSION="0.0.0"; fi
          echo "RPM version: $VERSION"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          sed "s/@VERSION@/${VERSION}/" packaging/yue2studio.spec > ~/rpmbuild/SPECS/yue2studio.spec
          rpmbuild -bb --define "srcdir ${PWD}" ~/rpmbuild/SPECS/yue2studio.spec
          cp ~/rpmbuild/RPMS/x86_64/yue2studio-*.x86_64.rpm ./Yue2Studio-Linux-x64.rpm
          ls -la Yue2Studio-Linux-x64.rpm

      - name: Package standalone app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          pyinstaller --noconfirm --onedir --windowed --name "Yue2Studio" \
            --add-binary "bin/audiocpp_cli:bin" \
            --collect-all customtkinter \
            app/main.py
          cd dist
          zip -r ../${{ matrix.artifact_name }}.zip Yue2Studio.app

      # ----------------- UPLOAD ARTIFACTS -----------------
      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

      - name: Upload build artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

      - name: Upload build artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            Yue2Studio-Linux-x64.AppImage
            Yue2Studio-Linux-x64.rpm

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
          generate_release_notes: true
